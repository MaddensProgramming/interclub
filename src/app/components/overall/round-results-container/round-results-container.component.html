<div class="center-container">
  <mat-button-toggle-group
    class="m-1 stand-out"
    [value]="roundNumber"
    (change)="onRoundChange($event)"
  >
    @for (round of roundsArray; track round) {
    <mat-button-toggle [value]="round">{{ round }}</mat-button-toggle>
    }
  </mat-button-toggle-group>
</div>
@if (showDivisionSixNote) {
  <p>Afdeling 6 speelt niet op speeldagen 5 en 6. Rondes 5–9 van afdeling 6 staan bij speeldagen 7–11.</p>
}

<app-full-round-overview
  [roundNumberSubject]="roundNumberSubject"
></app-full-round-overview>
